[package]
name = "prompt-native"
version = "0.0.0"
description = "Prompt's one native module: the OS features the app used to reach through helper programs"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
libc = "0.2"
serde_json = "1"

# Why objc2: typed, maintained bindings for Apple's Objective-C frameworks (UserNotifications here), so calls
# and blocks are checked by the compiler instead of hand-written objc_msgSend.
[target.'cfg(target_os = "macos")'.dependencies]
# exception: Squirrel and ReactiveObjC are private Electron frameworks; an Objective-C exception from them must be
# caught before it reaches Rust frames (shipit_scheduling.rs).
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationSettings",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    # ReadFile and WriteFile take an OVERLAPPED, which lives in System_IO.
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
