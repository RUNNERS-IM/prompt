# main 을 release 브랜치로 합치면 Prompt 정식 판을 낸다. Split·센스·푸딩과 같은 방식:
# 1) 버전을 출시일(KST) 기준 2.{연도 끝자리}.{MMDD}{NN} 으로 올려 release 에 커밋한다([skip ci]).
#    NN 은 그날 몇 번째 출시인지(01 부터). 예) 2.6.103001, 같은 날 두 번째 2.6.103002.
#    규칙과 다음 번호를 v* 태그에서 찾는 방법은 config/scripts/prompt-bump-release.sh 에 있다.
# 2) GitHub Releases(RUNNERS-IM/prompt, 태그 v<버전>)에 초안을 먼저 만들고, 운영체제별 작업이 그 초안에 파일을 올린다.
#    - macOS(Apple silicon arm64): Developer ID 로 서명하고 Apple 공증까지 한다. 저장소 변수 PROMPT_MAC_X64 가
#      'true' 면 Intel(x64) 판도 같은 실행에서 함께 만든다(시험 전이라 기본은 끔).
#    - Windows(x64): 코드 서명 인증서가 없어서 서명하지 않는다. 처음 설치할 때 SmartScreen 경고가 뜬다.
#    - Linux(x64): AppImage·deb·rpm.
# 3) 세 운영체제의 업데이트 목록 파일(latest-mac.yml·latest.yml·latest-linux.yml)과 설치 파일이 모두 올라간 것을
#    확인한 뒤에만 초안을 공개하고 "Latest" 로 표시한다. 하나라도 빠지면 공개하지 않는다(초안은 사용자에게 안 보인다).
#
# 서명 키는 GitHub Secrets(RUNNERS-IM 조직 비밀값)로 이 실행 동안만 쓰는 임시 키체인을 만들고 끝나면 지운다.
# 러너 맥의 로그인 키체인·파일은 건드리지 않는다.
#
# orcad 템플릿(SSH 원격 호스트에 까는 서버 묶음)은 upstream 과 같이 node-server-tests.yml 로 여러 운영체제에서
# 만들어 받는다. 저장소 변수 PROMPT_ORCAD_TEMPLATE 가 'false' 면 건너뛰고 템플릿 없이 묶는다.
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 묶기·서명·공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 러너·서명 시험에 쓴다.
# 텔레메트리(PostHog 등)는 보내지 않으므로 upstream 의 관련 비밀값·검사 단계는 뺐다.
name: Prompt Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: '버전을 올리고 배포하기 (끄면 시험 실행)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prompt-release
  cancel-in-progress: false

jobs:
  prepare:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.bump.outputs.sha || steps.current.outputs.sha }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && 'release' || github.ref_name }}
          fetch-depth: 0 # tags tell which versions already exist

      - name: Bump the version and push
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          VERSION=$(config/scripts/prompt-bump-release.sh)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Prompt $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick the version of a test run
        id: current
        if: env.PUBLISH != 'true'
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 초안을 먼저 만들어 둔다. electron-builder 가 스스로 만들면 태그가 기본 브랜치(main) 끝을 가리키게 된다.
      # 앞서 멈춘 실행이 남긴 같은 버전의 초안이 있으면 지우고 새로 만든다. 공개된 릴리스는 건드리지 않는다.
      - name: Create the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG 는 이미 공개된 릴리스다. 덮어쓰지 않는다."
              exit 1
            fi
            echo "앞선 실행이 남긴 초안 $TAG 를 지우고 새로 만든다."
            gh release delete "$TAG" --yes
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Prompt $VERSION

          - 기반 커밋: \`${SHA:0:12}\`
          - macOS: Apple silicon 용, 서명·공증됨
          - Windows: 코드 서명이 없어 처음 설치할 때 SmartScreen 경고가 뜬다("추가 정보" → "실행")
          - Linux: AppImage · deb · rpm
          EOF
          gh release create "$TAG" --draft --target "$SHA" --title "Prompt $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # SSH 원격 호스트용 orcad 템플릿. upstream 출시와 같은 방식이고, GitHub 호스팅 러너만 쓴다(fast_runners: false).
  orcad-template:
    needs: prepare
    if: vars.PROMPT_ORCAD_TEMPLATE != 'false'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/node-server-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      build_template: true
      fast_runners: false

  mac:
    needs: [prepare, orcad-template]
    # 템플릿을 일부러 건너뛴 경우(skipped)에도 진행한다
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.orcad-template.result == 'success' || needs.orcad-template.result == 'skipped')
    # GitHub 호스팅 macos-15 는 Apple silicon(arm64) 러너다
    runs-on: macos-15
    timeout-minutes: 150
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      VERSION: ${{ needs.prepare.outputs.version }}
      WITH_X64: ${{ vars.PROMPT_MAC_X64 == 'true' }}
      WITH_TEMPLATE: ${{ needs.orcad-template.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # 20분 넘는 빌드 전에 서명 준비부터 해서, 비밀값이 빠졌으면 바로 멈춘다
      - name: Prepare a temporary signing keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The .p12 may be exported without a password, so an empty DEVELOPER_ID_P12_PASSWORD is allowed.
          for name in DEVELOPER_ID_P12_BASE64 ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::비밀값 $name 이 없다. 서명·공증 없이는 출시하지 않는다."
              exit 1
            fi
          done
          SECRETS="$RUNNER_TEMP/prompt-secrets"
          mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
          KEYCHAIN="$RUNNER_TEMP/prompt-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The search list is put back as it was when the run ends.
          security list-keychains -d user | tr -d '" ' > "$SECRETS/keychains-before"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$SECRETS/developer-id.p12"
          security import "$SECRETS/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$SECRETS/keychains-before")
          rm "$SECRETS/developer-id.p12"
          # The certificate must belong to the team the build config checks (ORCA_MAC_TEAM_ID).
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application:.*(RGWVXJ8URP)'; then
            echo "::error::임시 키체인에 팀 RGWVXJ8URP 의 Developer ID Application 인증서가 없다."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          printf '%s' "$ASC_API_KEY_P8" > "$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$SECRETS/"*
          # electron-builder: CSC_KEYCHAIN 으로 이 키체인에서 서명 인증서를 찾고,
          # APPLE_API_KEY(파일 경로)·APPLE_API_KEY_ID·APPLE_API_ISSUER 로 공증한다.
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$ASC_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$ASC_API_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      # Bundled host Node is cached by its exact pin.
      - name: Locate the pinned Node runtime cache
        run: echo "ORCA_NODE_RUNTIME_CACHE_DIR=$HOME/Library/Caches/orca-node-runtime" >>"$GITHUB_ENV"

      - name: Cache the pinned Node runtime
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/orca-node-runtime
          key: orca-node-runtime-mac-${{ hashFiles('src/shared/node-runtime-pin.ts') }}

      # Intel 판의 터미널 호스트를 묶은 뒤 실제로 켜 보는 검사가 있어서 x64 를 만들 때는 Rosetta 가 필요하다
      - name: Install Rosetta for the x64 slice
        if: env.WITH_X64 == 'true'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: |
            if [ "$WITH_X64" = "true" ]; then
              pnpm install --frozen-lockfile --cpu=current,x64,arm64
            else
              pnpm install --frozen-lockfile
            fi

      # Build required out/mobile-web using mobile's React Native/Expo install.
      - uses: ./.github/actions/install-mobile-dependencies

      # plutil lint accepts duplicate entitlements but codesign rejects them.
      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements

      - name: Build app
        run: pnpm run build:release

      - name: Download the orcad deployment template
        if: env.WITH_TEMPLATE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          path: out/orcad-template

      - name: Gate runtime file-watcher process isolation
        run: |
          node config/scripts/runtime-file-watcher-fault-harness.mjs
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron config/scripts/runtime-file-watcher-fault-harness.mjs

      # 서명 → 공증 → 스테이플 → dmg/zip → (publish 면) 초안 릴리스에 올리기. latest-mac.yml 도 여기서 만든다.
      - name: Package, sign, notarize (macOS)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -euo pipefail
            if [ "$WITH_X64" = "true" ]; then ARCH_FLAGS="--x64 --arm64"; NODE_SLOTS="darwin-arm64 darwin-x64"; else ARCH_FLAGS="--arm64"; NODE_SLOTS="darwin-arm64"; fi
            if [ "$PUBLISH" = "true" ]; then MODE=always; else MODE=never; fi
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON config/scripts/pinned-node-downloads.mjs $NODE_SLOTS
            node config/scripts/ensure-native-runtime.mjs --runtime=electron
            ORCA_MAC_RELEASE=1 pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dmg zip $ARCH_FLAGS --publish "$MODE"
        env:
          GH_TOKEN: ${{ github.token }}
          # The draft was created by the prepare job; long template/build time must not make builder refuse it.
          EP_GH_IGNORE_TIME: 'true'
          ORCA_BUILD_COMMIT: ${{ needs.prepare.outputs.sha }}
          ORCA_REQUIRE_ORCAD_TEMPLATE: ${{ env.WITH_TEMPLATE == 'true' && '1' || '' }}

      - name: Keep the files of a test run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prompt-${{ env.VERSION }}-mac-test
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          retention-days: 3

      - name: Remove the temporary keychain and keys
        if: always()
        run: |
          SECRETS="$RUNNER_TEMP/prompt-secrets"
          if [ -f "$SECRETS/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$SECRETS/keychains-before")
          fi
          security delete-keychain "$RUNNER_TEMP/prompt-signing.keychain-db" 2>/dev/null || true
          rm -rf "$SECRETS"

  windows:
    needs: [prepare, orcad-template]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.orcad-template.result == 'success' || needs.orcad-template.result == 'skipped')
    # upstream: windows-latest(2025 이미지)는 node-gyp 가 새 Visual Studio 를 못 찾아 네이티브 설치가 깨진다
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      VERSION: ${{ needs.prepare.outputs.version }}
      WITH_TEMPLATE: ${{ needs.orcad-template.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      # The packaged Windows CLI launcher is a Rust program.
      - name: Ensure the Rust toolchain for the Windows CLI launcher
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            rustup toolchain install stable --profile minimal
            rustup default stable
          }
          cargo --version

      - name: Build app
        shell: bash
        run: pnpm run build:release

      - name: Download the orcad deployment template
        if: env.WITH_TEMPLATE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          path: out/orcad-template

      # 서명 없이 묶는다. prompt-win-unsigned 설정은 원래 설정에서 SignPath 서명자 이름과
      # "업데이트 파일 서명 확인"만 끈 것이다. 이걸 안 끄면 설치된 앱이 다음 업데이트를 거부한다.
      - name: Package (Windows, unsigned)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 30
          shell: pwsh
          command: |
            node config/scripts/ensure-native-runtime.mjs --runtime=electron
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $mode = if ($env:PUBLISH -eq 'true') { 'always' } else { 'never' }
            pnpm exec electron-builder --config config/scripts/prompt-win-unsigned.electron-builder.config.cjs --win --publish $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ github.token }}
          EP_GH_IGNORE_TIME: 'true'
          ORCA_BUILD_COMMIT: ${{ needs.prepare.outputs.sha }}
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
          ORCA_REQUIRE_ORCAD_TEMPLATE: ${{ env.WITH_TEMPLATE == 'true' && '1' || '' }}

      - name: Verify Windows node-pty ConPTY runtime
        shell: pwsh
        run: |
          $runtimeDir = 'dist/win-unpacked/resources/node_modules/node-pty/build/Release'
          foreach ($file in @("$runtimeDir/conpty.node", "$runtimeDir/conpty/conpty.dll", "$runtimeDir/conpty/OpenConsole.exe")) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing Windows node-pty runtime file: $file"
            }
          }

      - name: Keep the files of a test run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prompt-${{ env.VERSION }}-windows-test
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          retention-days: 3

  linux:
    needs: [prepare, orcad-template]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.orcad-template.result == 'success' || needs.orcad-template.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      VERSION: ${{ needs.prepare.outputs.version }}
      WITH_TEMPLATE: ${{ needs.orcad-template.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      # pnpm's bundled node-gyp is not executable on Linux runners (upstream run 25081763129).
      - name: Use external node-gyp
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      # AT-SPI bindings for the computer-use provider check, rpm for builder's fpm backend.
      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm

      - name: Build app
        run: pnpm run build:release

      - name: Download the orcad deployment template
        if: env.WITH_TEMPLATE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          path: out/orcad-template

      - name: Gate runtime file-watcher process isolation
        run: |
          node config/scripts/runtime-file-watcher-fault-harness.mjs
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron config/scripts/runtime-file-watcher-fault-harness.mjs

      - name: Package (Linux)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -euo pipefail
            if [ "$PUBLISH" = "true" ]; then MODE=always; else MODE=never; fi
            node config/scripts/ensure-native-runtime.mjs --runtime=electron
            pnpm exec electron-builder --config config/electron-builder.config.cjs --linux AppImage deb rpm --x64 --publish "$MODE"
        env:
          GH_TOKEN: ${{ github.token }}
          EP_GH_IGNORE_TIME: 'true'
          ORCA_BUILD_COMMIT: ${{ needs.prepare.outputs.sha }}
          ORCA_REQUIRE_ORCAD_TEMPLATE: ${{ env.WITH_TEMPLATE == 'true' && '1' || '' }}

      - name: Load packaged node-pty on the Linux floor
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: node config/scripts/run-linux-packaged-node-pty-floor-smoke.mjs --app-dir dist/linux-unpacked

      - name: Keep the files of a test run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prompt-${{ env.VERSION }}-linux-test
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
          retention-days: 3

  # 세 운영체제가 다 올라간 것을 확인한 뒤에만 공개한다. 하나라도 실패하면 이 작업은 건너뛰고 초안으로 남는다.
  # 다음 실행(또는 실패한 작업만 다시 돌리기)이 그 초안을 이어 쓰거나 지우고 새로 만든다.
  publish:
    needs: [prepare, mac, windows, linux]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.prepare.outputs.version }}
      WITH_X64: ${{ vars.PROMPT_MAC_X64 == 'true' }}
    steps:
      - name: Verify every platform's update manifest and installer
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          required="latest-mac.yml prompt-macos-arm64.zip prompt-macos-arm64.dmg latest.yml prompt-windows-setup.exe latest-linux.yml prompt-linux.AppImage"
          if [ "$WITH_X64" = "true" ]; then required="$required prompt-macos-x64.zip prompt-macos-x64.dmg"; fi
          for name in $required; do
            if ! grep -qx "$name" <<<"$assets"; then
              echo "::error::$TAG 초안에 $name 이 없다. 공개하지 않는다."
              exit 1
            fi
          done

      - name: Publish the release as latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
